# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
name: Deploy to Firebase Hosting on merge
'on':
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESPRESSOWALLET }}'
          channelId: live
          projectId: espressowallet
      # Best-effort: the FIREBASE_SERVICE_ACCOUNT_ESPRESSOWALLET service
      # account currently lacks the IAM permissions Firestore deploys need
      # (serviceusage.services.get, at minimum a Firebase Rules Admin /
      # Cloud Datastore Owner role). Runs after hosting so a permissions
      # failure here never blocks the site itself from deploying; doesn't
      # fail the job, so it needs to be watched rather than relied on to
      # go red. Grant the missing role, or deploy rules manually with
      # `firebase deploy --only firestore` from an authenticated session,
      # to close this gap.
      - name: Deploy Firestore rules and indexes
        continue-on-error: true
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          npx firebase-tools deploy --only firestore --project espressowallet --non-interactive
          rm -f /tmp/firebase-service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ESPRESSOWALLET }}'
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
